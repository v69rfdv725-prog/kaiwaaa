<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buku Kaiwa Mandiri</title>
    <style>
        :root { --primary: #2c3e50; --accent: #3498db; --light: #ecf0f1; --dark: #34495e; --border: #bdc3c7; --purple: #9b59b6; }
        body { font-family: 'Segoe UI', sans-serif; margin: 0; padding: 15px; background-color: #f7f9fa; color: var(--dark); }
        header { background: var(--primary); color: white; padding: 10px; text-align: center; border-radius: 6px; margin-bottom: 15px; }
        .box { background: white; padding: 15px; border-radius: 8px; border: 1px solid var(--border); margin-bottom: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .form-group { margin-bottom: 10px; }
        .form-group label { display: block; font-weight: bold; margin-bottom: 5px; font-size: 14px; }
        input[type="text"], textarea { width: 100%; padding: 10px; box-sizing: border-box; border: 1px solid var(--border); border-radius: 6px; font-size: 15px; }
        textarea { height: 80px; resize: vertical; }
        button { width: 100%; background: var(--accent); color: white; border: none; padding: 12px; font-size: 15px; border-radius: 6px; cursor: pointer; font-weight: bold; margin-top: 5px; }
        button:hover { opacity: 0.9; }
        .chapter-btn-container { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 10px; margin-bottom: 15px; }
        .btn-chap { width: auto; white-space: nowrap; background: #e0e0e0; color: #333; padding: 8px 12px; font-size: 14px; }
        .btn-chap.active { background: var(--accent); color: white; }
        .kaiwa-item { background: #fffcf5; border-left: 4px solid var(--accent); padding: 15px; margin-bottom: 15px; border-radius: 0 6px 6px 0; }
        .kaiwa-text { font-size: 24px; line-height: 2.5; margin-bottom: 10px; }
        ruby { cursor: pointer; padding: 0 2px; border-radius: 4px; }
        ruby:hover { background: #e1f5fe; }
        rt { font-size: 12px; color: #555; }
        .bunpou-box { background: #fdf6e3; border-left: 4px solid var(--purple); padding: 10px; font-size: 14px; border-radius: 0 4px 4px 0; margin-top: 5px; }
        .bunpou-header { font-weight: bold; color: var(--purple); display: flex; justify-content: space-between; align-items: center; }
        .btn-link { background: none; color: var(--purple); padding: 0; width: auto; margin: 0; font-size: 12px; text-decoration: underline; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 1000; }
        .modal-content { background: white; padding: 20px; border-radius: 8px; width: 90%; max-width: 400px; }
        .footer-ops { display: flex; gap: 5px; margin-top: 20px; }
        .btn-sec { background: #95a5a6; font-size: 12px; padding: 8px; }
        .btn-danger { background: #e74c3c; font-size: 12px; padding: 8px; }
    </style>
</head>
<body>

<header>
    <h2>📚 Buku Kaiwa & Bunpou Mandiri</h2>
    <div id="statusIndicator" style="font-size: 11px; color: #2ecc71;">Sistem JavaScript: Siap Aktif</div>
</header>

<div class="box">
    <div class="form-group">
        <label>Judul Bab Sekarang:</label>
        <input type="text" id="chapterTitleInput" oninput="changeTitle()" placeholder="Ubah judul bab...">
    </div>
    <div class="form-group">
        <label>Masukkan Kalimat Kaiwa:</label>
        <textarea id="kaiwaInputBox" placeholder="Ketik atau tempel teks Jepang..."></textarea>
    </div>
    <button onclick="submitKaiwa()" style="background: #2ecc71;">+ Masukkan Teks ke Halaman</button>
</div>

<h3>Daftar Bab:</h3>
<div id="chapterTabs" class="chapter-btn-container"></div>
<button onclick="addChapter()" class="btn-chap" style="background: var(--primary); color: white; margin-bottom: 15px;">+ Buat Bab Baru</button>

<div class="box" style="background: #fff;">
    <h2 id="currentChapterHeading" style="margin-top: 0; border-bottom: 2px solid var(--primary); padding-bottom: 8px;">Memuat...</h2>
    <div id="pageLines"></div>
</div>

<div class="footer-ops">
    <button class="btn-sec" onclick="exportJSON()">💾 Ekspor Data</button>
    <button class="btn-sec" onclick="document.getElementById('fileInput').click()">📂 Impor Data</button>
    <input type="file" id="fileInput" style="display:none" onchange="importJSON(this)">
    <button class="btn-danger" onclick="clearData()">⚠️ Bersihkan Memori HP</button>
</div>

<!-- Modal Kanji -->
<div id="kModal" class="modal">
    <div class="modal-content">
        <h3 id="kTitle">Edit Kanji</h3>
        <div class="form-group">
            <label>Cara Baca (Furigana):</label>
            <input type="text" id="fInput" placeholder="Contoh: わたし">
        </div>
        <div class="form-group">
            <label>Arti Radikal Mandiri:</label>
            <textarea id="rInput" placeholder="Contoh: Elemen orang..."></textarea>
        </div>
        <div style="display: flex; gap: 10px; margin-top: 15px;">
            <button onclick="saveK()" style="margin:0;">Simpan</button>
            <button onclick="closeK()" style="background:#bdc3c7; color:#333; margin:0;">Batal</button>
        </div>
    </div>
</div>

<!-- Modal Bunpou -->
<div id="bModal" class="modal">
    <div class="modal-content">
        <h3>Edit Keterangan Bunpou</h3>
        <p id="bTarget" style="font-style:italic; font-size:13px; color:#666;"></p>
        <div class="form-group">
            <label>Catatan Bunpou Mandiri:</label>
            <textarea id="bInput" placeholder="Tulis rumus tata bahasa sendiri di sini..."></textarea>
        </div>
        <div style="display: flex; gap: 10px; margin-top: 15px;">
            <button onclick="saveB()" style="background:var(--purple); margin:0;">Simpan Bunpou</button>
            <button onclick="closeB()" style="background:#bdc3c7; color:#333; margin:0;">Batal</button>
        </div>
    </div>
</div>

<script>
    // Membaca atau memaksa buat ulang memori kosong jika rusak
    let appData = localStorage.getItem('myKaiwaBook');
    if (!appData || appData.includes("undefined") || appData === "null") {
        appData = [{ id: 1, title: 'irodori a2/1 bab1', kaiwas: [] }];
        localStorage.setItem('myKaiwaBook', JSON.stringify(appData));
    } else {
        appData = JSON.parse(appData);
    }

    let kanjiDB = JSON.parse(localStorage.getItem('myKanjiDB')) || {};
    let bunpouDB = JSON.parse(localStorage.getItem('myBunpouDB')) || {};

    // MENGGUNAKAN INDEKS MATRIKS SECARA RIGID UNTUK MENJAMIN KEBERHASILAN LOGIKA
    let currentId = appData[0].id;
    let selectedKanji = '';
    let selectedSentence = '';

    document.getElementById('statusIndicator').textContent = "Sistem JavaScript: Berhasil Dimuat Total";

    function sync() {
        localStorage.setItem('myKaiwaBook', JSON.stringify(appData));
        render();
    }

    function render() {
        // Render Tombol Tab Bab
        const tabs = document.getElementById('chapterTabs');
        tabs.innerHTML = '';
        appData.forEach(ch => {
            const btn = document.createElement('button');
            btn.className = `btn-chap ${ch.id === currentId ? 'active' : ''}`;
            btn.textContent = ch.title;
            btn.onclick = () => { currentId = ch.id; render(); };
            tabs.appendChild(btn);
        });

        // Cari data bab aktif
        const activeChapter = appData.find(c => c.id === currentId) || appData[0];
        currentId = activeChapter.id;

        document.getElementById('currentChapterHeading').textContent = activeChapter.title;
        document.getElementById('chapterTitleInput').value = activeChapter.title;

        // Render Baris Teks
        const container = document.getElementById('pageLines');
        container.innerHTML = '';

        if (!activeChapter.kaiwas || activeChapter.kaiwas.length === 0) {
            container.innerHTML = '<p style="color:#aaa; font-style:italic;">Belum ada percakapan. Tambahkan teks di atas.</p>';
            return;
        }

        activeChapter.kaiwas.forEach((text, idx) => {
            const item = document.createElement('div');
            item.className = 'kaiwa-item';

            const line = document.createElement('div');
            line.className = 'kaiwa-text';

            for (let char of text) {
                if ((char >= '\u4e00' && char <= '\u9faf') || (char >= '\u3400' && char <= '\u4dbf')) {
                    const data = kanjiDB[char] || { f: '', r: '' };
                    const ruby = document.createElement('ruby');
                    ruby.textContent = char;
                    ruby.onclick = () => openK(char);

                    const rt = document.createElement('rt');
                    rt.textContent = data.f || '';
                    ruby.appendChild(rt);

                    if (data.r) ruby.title = `Radikal: ${data.r}`;
                    line.appendChild(ruby);
                } else {
                    line.appendChild(document.createTextNode(char));
                }
            }

            // Tambah tombol hapus baris
            const delLink = document.createElement('button');
            delLink.className = 'btn-link';
            delLink.textContent = '[Hapus Baris]';
            delLink.style.color = '#e74c3c';
            delLink.style.float = 'right';
            delLink.onclick = () => {
                activeChapter.kaiwas.splice(idx, 1);
                sync();
            };
            line.appendChild(delLink);

            item.appendChild(line);

            // Kolom Catatan Bunpou Otomatis Mandiri
            const note = bunpouDB[text] || '';
            const bDiv = document.createElement('div');
            bDiv.className = 'bunpou-box';

            const bHeader = document.createElement('div');
            bHeader.className = 'bunpou-header';
